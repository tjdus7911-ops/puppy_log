name: android-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-smoke.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: APK (스텁 빌드 · 데모 흐름)
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug -Pmungroad.usePleosSdk=false -Pmungroad.useKakaoMap=false
      - name: 에뮬레이터 스모크 테스트
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 200
            adb shell settings put system user_rotation 1
            adb install -r -g android/app/build/outputs/apk/debug/app-debug.apk
            python3 android/scripts/smoke_ui.py com.mungroad || (python3 android/scripts/print_shots.py; exit 1)
            python3 android/scripts/print_shots.py
